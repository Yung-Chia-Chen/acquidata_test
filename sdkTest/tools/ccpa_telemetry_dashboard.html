<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCPA Telemetry</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --panel: #ffffff;
      --text: #172026;
      --muted: #60707c;
      --line: #d9e0e5;
      --accent: #087f8c;
      --accent-soft: #d8f1f3;
      --warn: #a05a00;
      --bad: #b42318;
      --good: #16703c;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    button, select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    h1 {
      font-size: 20px;
      line-height: 1.2;
      margin: 0;
      font-weight: 680;
      letter-spacing: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .status {
      min-width: 118px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      background: #f8fafb;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #8a9aa5;
      flex: 0 0 auto;
    }

    .status.connected .dot {
      background: var(--good);
    }

    .status.error .dot {
      background: var(--bad);
    }

    .btn {
      height: 34px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0 13px;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn:disabled {
      cursor: not-allowed;
      color: #93a1aa;
      background: #eef2f4;
    }

    .serial-select {
      height: 34px;
      min-width: 160px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0 10px;
    }

    main {
      padding: 18px 22px 22px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      align-items: start;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
    }

    .tile, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .tile {
      min-height: 118px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .label {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.25;
    }

    .value {
      font-size: 30px;
      line-height: 1;
      font-weight: 720;
      letter-spacing: 0;
      word-break: break-word;
    }

    .unit {
      font-size: 13px;
      color: var(--muted);
      margin-left: 4px;
      font-weight: 520;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid #edf1f3;
      padding-top: 9px;
    }

    .panel {
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      padding: 13px 14px;
      font-size: 14px;
      border-bottom: 1px solid var(--line);
    }

    .frames {
      max-height: calc(100vh - 156px);
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      background: #11191f;
      color: #dbe7ee;
      padding: 10px 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .source {
      color: var(--accent);
      font-weight: 650;
    }

    .unknown {
      color: #8a9aa5;
    }

    .warning {
      color: var(--warn);
    }

    @media (max-width: 1120px) {
      main {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .frames {
        max-height: 320px;
      }
    }

    @media (max-width: 620px) {
      header {
        align-items: stretch;
        flex-direction: column;
        padding: 14px;
      }

      .toolbar {
        justify-content: flex-start;
      }

      main {
        padding: 14px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>CCPA Telemetry</h1>
      <div class="toolbar">
        <div id="status" class="status"><span class="dot"></span><span id="statusText">Idle</span></div>
        <select id="remotePortSelect" class="serial-select" aria-label="Raspberry Pi serial port">
          <option value="">Remote port</option>
        </select>
        <button id="refreshPortsBtn" class="btn">Ports</button>
        <button id="connectBtn" class="btn primary">Connect</button>
        <button id="remoteBtn" class="btn">Remote</button>
        <button id="disconnectBtn" class="btn" disabled>Disconnect</button>
        <button id="clearBtn" class="btn">Clear</button>
      </div>
    </header>

    <main>
      <section class="grid" aria-label="Telemetry values">
        <article class="tile" data-key="bikeSpeedKph">
          <div class="label">車速</div>
          <div><span class="value unknown">--</span><span class="unit">KPH</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="cadenceRpm">
          <div class="label">踏頻</div>
          <div><span class="value unknown">--</span><span class="unit">RPM</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="riderTorqueNm">
          <div class="label">踩踏扭矩</div>
          <div><span class="value unknown">--</span><span class="unit">Nm</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="motorRpm">
          <div class="label">馬達轉速</div>
          <div><span class="value unknown">--</span><span class="unit">RPM</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="assistMode">
          <div class="label">輔助力模式</div>
          <div><span class="value unknown">--</span><span class="unit">Mode</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="batterySocPct">
          <div class="label">電池電量</div>
          <div><span class="value unknown">--</span><span class="unit">%</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="batteryVoltageMv">
          <div class="label">電池電壓</div>
          <div><span class="value unknown">--</span><span class="unit">mV</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="batteryCurrentMa">
          <div class="label">電池電流</div>
          <div><span class="value unknown">--</span><span class="unit">mA</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="batteryTemp1C">
          <div class="label">電池溫度 1</div>
          <div><span class="value unknown">--</span><span class="unit">°C</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="batteryTemp2C">
          <div class="label">電池溫度 2</div>
          <div><span class="value unknown">--</span><span class="unit">°C</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="batteryTemp3C">
          <div class="label">電池溫度 3</div>
          <div><span class="value unknown">--</span><span class="unit">°C</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="batteryTemp4C">
          <div class="label">電池溫度 4</div>
          <div><span class="value unknown">--</span><span class="unit">°C</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
        <article class="tile" data-key="rearGearIndex">
          <div class="label">變速器目前檔位</div>
          <div><span class="value unknown">--</span><span class="unit">Gear</span></div>
          <div class="meta"><span class="source">--</span><span class="age">--</span></div>
        </article>
      </section>

      <aside class="panel">
        <h2>Serial Frames</h2>
        <div id="frames" class="frames"></div>
      </aside>
    </main>
  </div>

  <script>
    const baudRate = 115200;
    const remotePortSelect = document.getElementById("remotePortSelect");
    const refreshPortsBtn = document.getElementById("refreshPortsBtn");
    const connectBtn = document.getElementById("connectBtn");
    const remoteBtn = document.getElementById("remoteBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const framesEl = document.getElementById("frames");
    const tiles = new Map([...document.querySelectorAll(".tile")].map((el) => [el.dataset.key, el]));

    let port;
    let reader;
    let remoteEvents;
    let keepReading = false;
    let lineBuffer = "";
    const values = {};
    const decoders = {
      0x029404FC: decodeGeneralInfo00,
      0x029404FE: decodeGeneralInfo00,
      0x029404F8: decodeGeneralInfo01,
      0x029404FA: decodeGeneralInfo01,
      0x02940015: decodeCentralAssistReq,
      0x1E942040: decodeControllerInfo00,
      0x1E942042: decodeControllerInfo00,
      0x1E942048: decodeControllerInfo02,
      0x1E94204A: decodeControllerInfo02,
      0x1E94204C: decodeControllerInfo03,
      0x1E94204E: decodeControllerInfo03,
      0x1E942444: decodeBatteryInfo01,
      0x1E942446: decodeBatteryInfo01,
      0x1E942458: decodeBatteryInfo06,
      0x1E94245A: decodeBatteryInfo06,
      0x1E944840: decodeRearDerailleurInfo00,
      0x1E944842: decodeRearDerailleurInfo00
    };

    refreshPortsBtn.addEventListener("click", loadRemotePorts);
    connectBtn.addEventListener("click", connectSerial);
    remoteBtn.addEventListener("click", connectRemoteSerial);
    disconnectBtn.addEventListener("click", disconnectSerial);
    clearBtn.addEventListener("click", () => {
      framesEl.textContent = "";
      for (const key of Object.keys(values)) delete values[key];
      renderAll();
    });

    setInterval(updateAges, 1000);
    renderAll();
    loadRemotePorts();

    async function loadRemotePorts() {
      try {
        const response = await fetch("/ports", { cache: "no-store" });
        if (!response.ok) throw new Error(`Ports HTTP ${response.status}`);

        const data = await response.json();
        const current = remotePortSelect.value;
        remotePortSelect.textContent = "";

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = data.ports.length ? "Remote port" : "No serial ports";
        remotePortSelect.appendChild(placeholder);

        for (const portName of data.ports) {
          const option = document.createElement("option");
          option.value = portName;
          option.textContent = portName;
          remotePortSelect.appendChild(option);
        }

        if (data.ports.includes(current)) {
          remotePortSelect.value = current;
        } else if (data.ports.length === 1) {
          remotePortSelect.value = data.ports[0];
        }
      } catch (error) {
        setStatus("Ports unavailable", "error");
      }
    }

    async function connectSerial() {
      if (!("serial" in navigator)) {
        setStatus("Web Serial unavailable", "error");
        return;
      }

      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate });
        keepReading = true;
        remotePortSelect.disabled = true;
        refreshPortsBtn.disabled = true;
        connectBtn.disabled = true;
        remoteBtn.disabled = true;
        disconnectBtn.disabled = false;
        setStatus("Connected", "connected");
        readLoop();
      } catch (error) {
        setStatus(error.message || "Connect failed", "error");
      }
    }

    function connectRemoteSerial() {
      if (!("EventSource" in window)) {
        setStatus("Remote unavailable", "error");
        return;
      }

      const selectedPort = remotePortSelect.value;
      if (!selectedPort) {
        setStatus("Select remote port", "error");
        return;
      }

      try {
        remoteEvents = new EventSource(`/events?port=${encodeURIComponent(selectedPort)}&baud=${baudRate}`);
        keepReading = true;
        remotePortSelect.disabled = true;
        refreshPortsBtn.disabled = true;
        connectBtn.disabled = true;
        remoteBtn.disabled = true;
        disconnectBtn.disabled = false;
        setStatus("Remote connecting", "");

        remoteEvents.addEventListener("open", () => {
          setStatus("Remote connected", "connected");
        });

        remoteEvents.addEventListener("message", (event) => {
          if (event.data) processLine(event.data);
        });

        remoteEvents.addEventListener("error", () => {
          if (keepReading) setStatus("Remote disconnected", "error");
        });
      } catch (error) {
        setStatus(error.message || "Remote failed", "error");
      }
    }

    async function disconnectSerial() {
      keepReading = false;
      try {
        if (remoteEvents) {
          remoteEvents.close();
          remoteEvents = null;
        }
        if (reader) {
          await reader.cancel();
          reader.releaseLock();
          reader = null;
        }
        if (port) {
          await port.close();
          port = null;
        }
      } catch (error) {
        appendFrame(`Disconnect: ${error.message || error}`);
      }
      connectBtn.disabled = false;
      remotePortSelect.disabled = false;
      refreshPortsBtn.disabled = false;
      remoteBtn.disabled = false;
      disconnectBtn.disabled = true;
      setStatus("Idle", "");
    }

    async function readLoop() {
      const decoder = new TextDecoder();
      while (port && keepReading) {
        try {
          reader = port.readable.getReader();
          while (keepReading) {
            const { value, done } = await reader.read();
            if (done) break;
            consumeText(decoder.decode(value, { stream: true }));
          }
        } catch (error) {
          if (keepReading) setStatus(error.message || "Read failed", "error");
        } finally {
          if (reader) {
            reader.releaseLock();
            reader = null;
          }
        }
      }
    }

    function consumeText(text) {
      lineBuffer += text.replace(/\r/g, "");
      let newlineIndex;
      while ((newlineIndex = lineBuffer.indexOf("\n")) >= 0) {
        const line = lineBuffer.slice(0, newlineIndex).trim();
        lineBuffer = lineBuffer.slice(newlineIndex + 1);
        if (line) processLine(line);
      }
    }

    function processLine(line) {
      appendFrame(line);
      parseRawFrame(line);
      parseTelemetryLine(line);
    }

    function parseRawFrame(line) {
      const match = line.match(/RAW RX\s+\S+\s+ID=0x([0-9A-Fa-f]+)\s+DLC=(\d+)\s+DATA=([0-9A-Fa-f ]*)/);
      if (!match) return;

      const id = Number.parseInt(match[1], 16);
      const dlc = Number.parseInt(match[2], 10);
      const bytes = match[3].trim() ? match[3].trim().split(/\s+/).slice(0, dlc).map((part) => Number.parseInt(part, 16)) : [];
      const decoder = decoders[id];
      if (decoder) decoder(bytes, id);
    }

    function parseTelemetryLine(line) {
      let match;
      if ((match = line.match(/Bike speed = ([\d.]+) KPH/))) setValue("bikeSpeedKph", Number(match[1]), "telemetry");
      else if ((match = line.match(/Cadence = (\d+) RPM/))) setValue("cadenceRpm", Number(match[1]), "telemetry");
      else if ((match = line.match(/Rider torque = ([\d.]+) Nm/))) setValue("riderTorqueNm", Number(match[1]), "telemetry");
      else if ((match = line.match(/Motor RPM = (\d+) RPM/))) setValue("motorRpm", Number(match[1]), "telemetry");
      else if ((match = line.match(/Assist mode = (off|eco\+?|normal|sport\+?)/))) setValue("assistMode", match[1], "telemetry");
      else if ((match = line.match(/Assist level = (\d+)/))) setAssistLevel(Number(match[1]), "telemetry");
      else if ((match = line.match(/Assist raw ID=0x([0-9A-Fa-f]+) raw=0x([0-9A-Fa-f]+) level=(\d+) mode=(\S+)/))) {
        updateAssistDebug(`0x${match[1].toUpperCase()}`, Number.parseInt(match[2], 16), Number(match[3]));
      }
      else if (line.match(/Assist (level|mode) = (NULL|unknown)/)) clearValue("assistMode");
      else if ((match = line.match(/Battery SOC = (\d+) %/))) setValue("batterySocPct", Number(match[1]), "telemetry");
      else if ((match = line.match(/Battery voltage = (\d+) mV/))) setValue("batteryVoltageMv", Number(match[1]), "telemetry");
      else if ((match = line.match(/Battery current = (\d+) mA/))) setValue("batteryCurrentMa", Number(match[1]), "telemetry");
      else if ((match = line.match(/Rear gear = (\d+) \/ (\d+)/))) setValue("rearGearIndex", `${match[1]} / ${match[2]}`, "telemetry");
      else if ((match = line.match(/Battery temps = ([\d\-, ]+) C/))) setBatteryTemps(match[1].trim().split(",").map((part) => part.trim()), "telemetry");
    }

    function decodeGeneralInfo00(bytes, id) {
      if (bytes.length < 6) return;
      const speedRaw = u16(bytes[0], bytes[1]);
      if (speedRaw !== 0xFFFF) {
        setValue("bikeSpeedKph", speedRaw * 0.01, hexId(id), "general");
      } else {
        clearValue("bikeSpeedKph");
      }

      setValue("cadenceRpm", bytes[4], hexId(id), "general");

      const torqueRaw = u16(bytes[2], bytes[3]);
      if (torqueRaw !== 0xFFFF && torqueRaw !== 0x0000) {
        setValue("riderTorqueNm", torqueRaw * 0.01, hexId(id), "general");
      } else {
        clearValue("riderTorqueNm");
      }
    }

    function decodeGeneralInfo01(bytes, id) {
      if (bytes.length < 5) return;
      if (bytes[4] !== 0xFF && bytes[4] !== 0x00) {
        setValue("batterySocPct", bytes[4], hexId(id), "general");
      } else {
        clearValue("batterySocPct");
      }
    }

    function decodeCentralAssistReq(bytes, id) {
      if (bytes.length >= 2) {
        setAssistLevel(bytes[1] & 0x0F, hexId(id));
      }
    }

    function decodeControllerInfo00(bytes, id) {
      if (bytes.length < 2) return;
      if (hasGeneralSource("bikeSpeedKph")) return;
      const speedRaw = u16(bytes[0], bytes[1]);
      if (speedRaw !== 0xFFFF) setValue("bikeSpeedKph", speedRaw * 0.01, hexId(id), "device");
    }

    function decodeControllerInfo02(bytes, id) {
      if (bytes.length < 7) return;
      setValue("motorRpm", u16(bytes[4], bytes[5]), hexId(id), "device");
    }

    function decodeControllerInfo03(bytes, id) {
      if (bytes.length >= 4 && !hasGeneralSource("cadenceRpm")) {
        setValue("cadenceRpm", bytes[3], hexId(id), "device");
      }
      if (bytes.length >= 6 && !hasGeneralSource("riderTorqueNm")) {
        setValue("riderTorqueNm", u16(bytes[4], bytes[5]) * 0.1, hexId(id), "device");
      }
    }

    function decodeBatteryInfo01(bytes, id) {
      if (bytes.length < 7) return;
      setValue("batteryVoltageMv", u24(bytes[0], bytes[1], bytes[2]), hexId(id), "device");
      setValue("batteryCurrentMa", u16(bytes[4], bytes[5]), hexId(id), "device");
      if (!hasGeneralSource("batterySocPct") && bytes[6] !== 0xFF) {
        setValue("batterySocPct", bytes[6], hexId(id), "device");
      }
    }

    function decodeBatteryInfo06(bytes, id) {
      if (bytes.length < 4) return;
      setBatteryTemps(bytes.slice(0, 4).map(temp), hexId(id));
    }

    function decodeRearDerailleurInfo00(bytes, id) {
      if (bytes.length >= 2) setValue("rearGearIndex", `${bytes[0]} / ${bytes[1]}`, hexId(id), "device");
    }

    function setAssistLevel(level, source) {
      if (level <= 5) {
        setValue("assistMode", assistModeName(level), source);
      }
    }

    function updateAssistDebug(source, rawValue, level) {
      if (source === "0x02940015") {
        setAssistLevel(level, source);
      }
    }

    function setBatteryTemps(temps, source) {
      for (let index = 0; index < 4; index += 1) {
        const value = temps[index];
        const key = `batteryTemp${index + 1}C`;
        if (value === undefined || value === "" || Number(value) <= -999) {
          clearValue(key);
        } else {
          setValue(key, Number(value), source);
        }
      }
    }

    function assistModeName(level) {
      return ["off", "eco", "eco+", "normal", "sport", "sport+"][level] || "unknown";
    }

    function setValue(key, value, source, sourceType = "telemetry") {
      values[key] = { value, source, sourceType, time: Date.now() };
      renderValue(key);
    }

    function clearValue(key) {
      delete values[key];
      renderValue(key);
    }

    function hasGeneralSource(key) {
      return values[key]?.sourceType === "general";
    }

    function renderAll() {
      for (const key of tiles.keys()) renderValue(key);
    }

    function renderValue(key) {
      const tile = tiles.get(key);
      if (!tile) return;
      const record = values[key];
      const valueEl = tile.querySelector(".value");
      const sourceEl = tile.querySelector(".source");
      const ageEl = tile.querySelector(".age");

      if (!record) {
        valueEl.textContent = "--";
        valueEl.classList.add("unknown");
        sourceEl.textContent = "--";
        ageEl.textContent = "--";
        return;
      }

      valueEl.textContent = formatValue(key, record.value);
      valueEl.classList.remove("unknown");
      sourceEl.textContent = record.source;
      ageEl.textContent = ageText(record.time);
    }

    function updateAges() {
      for (const key of Object.keys(values)) renderValue(key);
    }

    function formatValue(key, value) {
      if (key === "bikeSpeedKph") return Number(value).toFixed(2);
      if (key === "riderTorqueNm") return Number(value).toFixed(2);
      return String(value);
    }

    function appendFrame(line) {
      const shouldStick = framesEl.scrollTop + framesEl.clientHeight >= framesEl.scrollHeight - 18;
      framesEl.textContent += line + "\n";
      const lines = framesEl.textContent.split("\n");
      if (lines.length > 500) framesEl.textContent = lines.slice(lines.length - 500).join("\n");
      if (shouldStick) framesEl.scrollTop = framesEl.scrollHeight;
    }

    function setStatus(text, className) {
      statusText.textContent = text;
      statusEl.className = `status ${className || ""}`.trim();
    }

    function u16(lo, hi) {
      return lo | (hi << 8);
    }

    function u24(b0, b1, b2) {
      return b0 | (b1 << 8) | (b2 << 16);
    }

    function temp(raw) {
      return raw - 64;
    }

    function hexId(id) {
      return "0x" + id.toString(16).toUpperCase().padStart(8, "0");
    }

    function ageText(time) {
      const seconds = Math.max(0, Math.floor((Date.now() - time) / 1000));
      return seconds === 0 ? "now" : `${seconds}s`;
    }
  </script>
</body>
